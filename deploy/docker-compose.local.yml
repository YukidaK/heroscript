# Stack local para testar o site com o runner, sem tunel:
#   scripts/build_site.sh
#   docker build -f deploy/Dockerfile -t heroscript . && docker build -f deploy/Dockerfile.runner -t heroscript-runner .
#   docker compose -f deploy/docker-compose.local.yml up
# e abra http://127.0.0.1:8080/playground/. O runner herda o isolamento do docker-compose.yml.
name: heroscript-local
services:
  heroscript:
    image: heroscript:latest
    ports:
      - "127.0.0.1:${PORT:-8080}:80"   # so a propria maquina
    networks:
      - web
      - runner-network

  runner:
    extends:
      file: docker-compose.yml
      service: runner
    container_name: heroscript-local-runner
    restart: "no"
    environment:
      RUNNER_HASH: local

networks:
  web:
    driver: bridge
  runner-network:
    driver: bridge
    internal: true
