# Limite de chamadas ao runner por visitante. Atras do tunel o endereco de origem e sempre o cloudflared,
# entao a chave e o IP real informado pelo Cloudflare.
map $http_cf_connecting_ip $api_client {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $api_client zone=api:1m rate=3r/s;

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Os arquivos do playground (heroscript.jar, ecj.jar, playground.js...) mantem
    # o mesmo nome a cada deploy. Sem este cabecalho o Cloudflare guarda a versao
    # antiga por 4h e o visitante pega JS novo com jar velho. "no-cache" so obriga
    # a revalidar: quando nada mudou a resposta e um 304 vazio.
    add_header Cache-Control "no-cache" always;

    # O CheerpJ le os .jar com Range requests; o nginx ja responde 206 para
    # arquivos estaticos. Os jars ficam fora do gzip de proposito: ja sao
    # comprimidos e resposta gzip nao aceita Range.
    gzip            on;
    gzip_types      application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_vary       on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Execucao do playground no servidor (heroscript.server.RunnerServer, no container `runner`).
    # Qualquer falha aqui (runner fora do ar, ocupado, limite) vira erro HTTP e o playground passa a
    # executar no navegador com o CheerpJ.
    location /api/ {
        # Nome resolvido a cada requisicao pelo DNS do Docker, e nao na subida do nginx:
        # com `proxy_pass http://runner:8080` fixo, o site inteiro nao subiria sem o runner.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $runner http://runner:8080;
        proxy_pass $runner;

        proxy_connect_timeout 2s;
        proxy_read_timeout    20s;   # 3 s de fila + 10 s de execucao no runner, com folga
        client_max_body_size  64k;   # mesmo limite do runner
        limit_req             zone=api burst=20 nodelay;
        limit_req_status      429;
    }
}
