services:
  heroscript:
    image: heroscript:latest
    container_name: heroscript
    restart: unless-stopped
    environment:
      # nao e lido por nada: muda a config do container quando o site muda, pra
      # o compose recriar em vez de manter a imagem antiga rodando
      BUILD_HASH: ${BUILD_HASH}
    networks:
      - heroscript-network
      - runner-network

  # Executa os programas do playground (POST /api/..., repassado pelo nginx).
  # Roda Java arbitrario enviado por visitantes: tudo abaixo existe para conter isso.
  runner:
    image: heroscript-runner:latest
    container_name: heroscript-runner
    restart: unless-stopped
    environment:
      RUNNER_HASH: ${RUNNER_HASH}
    read_only: true                 # nada no disco da imagem pode ser alterado
    tmpfs:
      - /tmp:size=64m,mode=1777     # unico lugar gravavel; some quando o container reinicia
    user: "65534:65534"             # nobody
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256                 # barra fork bomb / explosao de threads
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    networks:
      - runner-network              # so esta: sem internet, sem LAN, sem os outros stacks

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: heroscript-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - heroscript
    networks:
      - heroscript-network

# Sem `ports:` de proposito — a unica entrada e o tunel.
networks:
  heroscript-network:
    driver: bridge
  # internal: o Docker nao cria rota de saida. O runner so alcanca o nginx, e so o nginx alcanca o runner.
  runner-network:
    driver: bridge
    internal: true
